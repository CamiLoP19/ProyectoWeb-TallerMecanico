# Configuración de SonarCloud para ProyectoWeb - Taller Mecánico
# Organización: CamiLoP19
# Proyecto: ProyectoWeb-TallerMecanico

sonar.projectKey=CamiLoP19_ProyectoWeb-TallerMecanico
sonar.organization=camilop19

# Nombre y versión del proyecto
sonar.projectName=ProyectoWeb-TallerMecanico
sonar.projectVersion=1.0

# Ruta del código fuente
sonar.sources=ProyectoWeb

# Exclusiones - Archivos que NO se deben analizar
# Esto reduce el conteo de LOC y enfoca el análisis en código propio
sonar.exclusions=\
  **/wwwroot/lib/**,\
  **/wwwroot/js/bootstrap*.js,\
  **/wwwroot/js/jquery*.js,\
  **/wwwroot/css/bootstrap*.css,\
  **/obj/**,\
  **/bin/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/node_modules/**,\
  **/.vs/**,\
  **/packages/**,\
  **/reporte_html/**,\
  **/*.jtl,\
  **/resultados.jtl

# Archivos de pruebas (si existieran)
sonar.test.inclusions=**/*Tests.cs,**/*Test.cs

# Configuración de C#
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vscoveragexml.reportsPaths=**/TestResults/**/*.coveragexml

# Configuración de JavaScript
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info

# Codificación de archivos
sonar.sourceEncoding=UTF-8

# Nota: Esta configuración excluye bibliotecas de terceros para obtener
# métricas más precisas del código desarrollado por el equipo
